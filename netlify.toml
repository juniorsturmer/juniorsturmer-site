[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/juniorsturmer-site/*"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/blog/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
